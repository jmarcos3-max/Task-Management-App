<h1>Add Task</h1>

<form method="POST">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title" required>

    <br><br>

    <label>Description:</label>
    <textarea name="description" required></textarea>

    <br><br>

    <button type="submit">Add Task</button>
</form>

<a href="/">Back</a>
