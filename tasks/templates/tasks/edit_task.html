<h1>Edit Task</h1>

<form method="POST">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title" value="{{ task.title }}" required>

    <br><br>

    <label>Description:</label>
    <textarea name="description" required>{{ task.description }}</textarea>

    <br><br>

    <button type="submit">Save Changes</button>
</form>

<a href="/">Back</a>
